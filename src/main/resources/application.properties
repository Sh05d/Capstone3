spring.application.name=Capstone_3

# Load local overrides (password, API keys). File is gitignored — copy from application-local.properties.example
spring.config.import=optional:classpath:application-local.properties

spring.datasource.url=jdbc:mysql://localhost:3306/capstone_3
spring.datasource.username=root

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
# update = apply schema changes without dropping the whole schema on each start (avoids crashing MySQL under heavy DDL)
spring.jpa.hibernate.ddl-auto=update

spring.web.error.include-message=always
spring.web.error.include-stacktrace=always

# --- AI (non-secret defaults; key goes in application-local.properties) ---
ai.model=gpt-4o-mini
ai.base-url=https://api.openai.com/v1

# --- GitHub API (optional token in application-local.properties for higher rate limits) ---
github.api.base-url=https://api.github.com
